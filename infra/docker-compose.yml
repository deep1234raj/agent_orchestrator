# AAOP — local development stack
#
# Usage:
#   docker compose -f infra/docker-compose.yml up --build
#
# Three services:
#   db   — Postgres 16, named volume for persistence
#   api  — FastAPI + LangGraph runtime, hot-reload, runs migrations on boot
#   web  — Next.js dev server, hot-reload, talks to api on the docker network
#
# Healthchecks ensure the api waits for the db, and the web waits for the api.

name: aaop

services:
  db:
    image: postgres:16-alpine
    container_name: aaop-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aaop}
    ports:
      - "5432:5432"
    volumes:
      - aaop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aaop}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: aaop-api
    depends_on:
      db:
        condition: service_healthy
    # Load all secrets from .env at the repo root.
    # env_file paths are resolved relative to this compose file's directory (infra/),
    # so ../.env always points to the repo root regardless of where docker compose is run.
    env_file: ../.env
    environment:
      # Docker-specific overrides — these take precedence over env_file.
      # DATABASE_URL uses the 'db' service hostname, which only exists inside Docker.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-aaop}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      # Source mount for hot reload. The .venv is kept inside the image to
      # avoid host/container mismatch issues.
      - ../api:/app
      - aaop_api_venv:/app/.venv
    # Run migrations, then start the API with hot reload.
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: aaop-web
    depends_on:
      api:
        condition: service_healthy
    # Load NEXT_PUBLIC_* overrides from .env at the repo root.
    env_file: ../.env
    environment:
      # Docker-specific overrides — these take precedence over env_file.
      # Server-side calls hit the api container; browser-side calls hit localhost.
      CI: true
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      API_URL_INTERNAL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ../web:/app
      - aaop_web_node_modules:/app/node_modules
      - aaop_web_next:/app/.next
    command: pnpm dev

volumes:
  aaop_pgdata:
  aaop_api_venv:
  aaop_web_node_modules:
  aaop_web_next:
